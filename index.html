<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title> </title>

<style>
body {
  margin: 0;
  background: black;
  color: #00ff00;
  font-family: monospace;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* Logs et message final */
#logs, #final {
  display: none;
  width: 80%;
}

#logs.active, #final.active {
  display: block;
}

#logs {
  height: 80vh;
  overflow: hidden;
  font-size: 13px;
  white-space: pre-wrap;
}

#final {
  color: white;
  font-size: 24px;
  text-align: center;
}
</style>
</head>

<body>

<!-- LOGS -->
<div id="logs"></div>

<!-- MESSAGE FINAL -->
<div id="final">
  holala, tu as vraiment cliqué dessus ?<br><br>
  Tsss. Fait attention, la prochaine fois qu'il y aura un lien dans mon mail,
  ce sera un VRAI malware !
</div>

<script>
const logs = document.getElementById("logs");

/* 1️⃣ ÉCRAN NOIR TOTAL PENDANT 3s */
setTimeout(startLogs, 3000);

function startLogs() {
  logs.classList.add("active");

  const interval = setInterval(() => {
    logs.textContent +=
      "[SYS] " +
      Math.random().toString(16).slice(2) +
      " :: privilege escalation confirmed\n";

    if (logs.textContent.length > 18000) {
      logs.textContent = logs.textContent.slice(2000);
    }
  }, 10);

  /* 2️⃣ LOGS LONGS */
  setTimeout(() => {
    clearInterval(interval);
    logs.classList.remove("active");
    document.getElementById("final").classList.add("active");
  }, 12000); // 12 secondes de logs
}
</script>

</body>
</html>
