<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>System Security Monitor</title>

<style>
body {
  margin: 0;
  background: black;
  color: #00ff00;
  font-family: monospace;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

#scan, #logs, #final {
  display: none;
  width: 80%;
}

#scan.active, #logs.active, #final.active {
  display: block;
}

#words {
  text-align: center;
  font-size: 18px;
  margin-bottom: 20px;
}

.progress {
  width: 100%;
  background: #222;
}

.bar {
  height: 18px;
  width: 0%;
  background: #00ff00;
}

#logs {
  height: 80vh;
  overflow: hidden;
  font-size: 13px;
  white-space: pre-wrap;
}

#final {
  color: white;
  font-size: 24px;
  text-align: center;
}
</style>
</head>

<body>

<!-- Écran 1 -->
<div id="scan" class="active">
  <div id="words">Initializing…</div>
  <div class="progress">
    <div class="bar" id="bar"></div>
  </div>
</div>

<!-- Écran 2 -->
<div id="logs"></div>

<!-- Message final -->
<div id="final">
  holala, tu as vraiment cliqué dessus ?<br><br>
  Tsss. Fait attention, la prochaine fois qu'il y aura un lien dans mon mail,
  ce sera un VRAI malware !
</div>

<script>
/* ===== PHASE 1 : SCAN ===== */

const wordsList = [
  "Encrypting nodes",
  "Resolving kernel vectors",
  "Injecting entropy",
  "Parsing memory blocks",
  "Syncing shadow buffers",
  "Calculating checksum",
  "Authenticating socket",
  "Flushing cache layer",
  "Mounting secure volume",
  "Handshake protocol"
];

const words = document.getElementById("words");
const bar = document.getElementById("bar");

let progress = 0;

const wordInterval = setInterval(() => {
  words.textContent = wordsList[Math.floor(Math.random() * wordsList.length)] + "...";
}, 500);

const scanInterval = setInterval(() => {
  progress += Math.random() * 8;
  if (progress >= 100) {
    progress = 100;
    clearInterval(scanInterval);
    clearInterval(wordInterval);
    setTimeout(startLogs, 1000);
  }
  bar.style.width = progress + "%";
}, 300);

/* ===== PHASE 2 : LOGS ===== */

function startLogs() {
  document.getElementById("scan").classList.remove("active");
  const logs = document.getElementById("logs");
  logs.classList.add("active");

  let interval = setInterval(() => {
    logs.textContent +=
      "[SYS] access::" +
      Math.random().toString(16).slice(2) +
      " :: GRANTED\n";

    if (logs.textContent.length > 12000) {
      logs.textContent = logs.textContent.slice(1000);
    }
  }, 15);

  /* durée volontairement longue */
  setTimeout(() => {
    clearInterval(interval);
    logs.classList.remove("active");
    document.getElementById("final").classList.add("active");
  }, 10000); // 10 secondes
}
</script>

</body>
</html>
