<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title> </title>

<style>
body {
  margin: 0;
  background: black;
  color: #00ff00;
  font-family: monospace;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

#logs, #final {
  display: none;
  width: 80%;
}

#logs.active, #final.active {
  display: block;
}

#logs {
  height: 80vh;
  overflow: hidden;
  font-size: 13px;
  white-space: pre-wrap;
}

#final {
  color: white;
  font-size: 24px;
  text-align: center;
}
</style>
</head>

<body>

<!-- PHASE LOGS -->
<div id="logs" class="active"></div>

<!-- RÉVÉLATION -->
<div id="final">
  holala, tu as vraiment cliqué dessus ?<br><br>
  Tsss. Fait attention, la prochaine fois qu'il y aura un lien dans mon mail,
  ce sera un VRAI malware !
</div>

<script>
const logs = document.getElementById("logs");

const interval = setInterval(() => {
  logs.textContent +=
    "[SYS] " +
    Math.random().toString(16).slice(2) +
    " :: privilege escalation confirmed\n";

  if (logs.textContent.length > 16000) {
    logs.textContent = logs.textContent.slice(1500);
  }
}, 10);

/* phase longue volontaire */
setTimeout(() => {
  clearInterval(interval);
  logs.classList.remove("active");
  document.getElementById("final").classList.add("active");
}, 12000); // 12 secondes
</script>

</body>
</html>
